<script>
'use strict';
const DOW=['일','월','화','수','목','금','토'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates: plain YYYY-MM-DD strings, computed in UTC so time zones cannot shift a day ---------- */
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toUTC(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function fromUTC(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(s,n){const d=toUTC(s);d.setUTCDate(d.getUTCDate()+n);return fromUTC(d)}
function dow(s){return toUTC(s).getUTCDay()}
function mondayOf(s){const w=dow(s);return addDays(s,w===0?-6:1-w)}
function md(s){const[,m,d]=s.split('-').map(Number);return m+'/'+d}
const year=s=>Number(s.slice(0,4));
function longDate(s){const[y,m,d]=s.split('-').map(Number);return y+'년 '+m+'월 '+d+'일 '+DOW[dow(s)]+'요일'}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&fromUTC(toUTC(s))===s}
/* Same weekday last year: 52 weeks back, the way the paper sheet lines up Mon 2026-11-02 with Mon 2025-11-03. */
const lastYear=s=>addDays(s,-364);

/* ---------- money: integer cents only ---------- */
function usd(c){const a=Math.abs(c);return '$'+Math.floor(a/100).toLocaleString('en-US')+'.'+pad(a%100)}
function parseMoney(t){const s=String(t).replace(/[$,\s]/g,'');if(!/^\d+(\.\d{0,2})?$/.test(s)&&!/^\.\d{1,2}$/.test(s))return null;const[w,f='']=s.split('.');const c=Number(w||0)*100+Number((f+'00').slice(0,2));return c>999999999?null:c}
function signed(c){return (c>0?'+':c<0?'-':'')+usd(c)}
function pct(n,o){if(!o)return '';const v=Math.round((n-o)/o*100);return (v>0?'+':'')+v+'%'}
const tone=v=>v>0?'up':v<0?'down':'';
const cleanName=n=>String(n||'').replace(/^[=+\-@\s]+/,'').slice(0,20).trim();

/* ---------- storage: IndexedDB on this phone only ---------- */
let db,recs=new Map(),weeks=new Map(),exps=new Map(),cfg={};
const DEFAULT_CATS=['임대료','인건비','공과금','세탁 재료','보험','세금','수리','기타'];
const cats=()=>cfg.expCats||DEFAULT_CATS;
const liveExps=()=>[...exps.values()].filter(x=>!x.deleted);
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const cleanText=(t,n)=>String(t||'').replace(/^[=+\-@\s]+/,'').slice(0,n).trim();
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('maesang-note-v2',1);r.onupgradeneeded=()=>{const d=r.result;const has=n=>d.objectStoreNames.contains(n);if(!has('records'))d.createObjectStore('records',{keyPath:'date'});if(!has('kv'))d.createObjectStore('kv');if(!has('snapshots'))d.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true});if(!has('weeks'))d.createObjectStore('weeks',{keyPath:'date'});if(!has('expenses'))d.createObjectStore('expenses',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function tx(store,mode,fn){return new Promise((ok,no)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
const putRec=r=>tx('records','readwrite',s=>s.put(r));
const setCfg=(k,v)=>{cfg[k]=v;return tx('kv','readwrite',s=>s.put(v,k))};
async function loadAll(){
  const list=await tx('records','readonly',s=>s.getAll());recs=new Map(list.map(r=>[r.date,r]));
  const wl=await tx('weeks','readonly',s=>s.getAll());weeks=new Map(wl.map(w=>[w.date,w]));
  const el=await tx('expenses','readonly',s=>s.getAll());exps=new Map(el.map(x=>[x.id,x]));
  const keys=await tx('kv','readonly',s=>s.getAllKeys());const vals=await tx('kv','readonly',s=>s.getAll());
  cfg={};keys.forEach((k,i)=>cfg[k]=vals[i]);
}
async function replaceAll(list,wl,el){
  await tx('expenses','readwrite',s=>{s.clear();el.forEach(r=>s.put(r))});exps=new Map(el.map(r=>[r.id,r]));
 await tx('records','readwrite',s=>{s.clear();list.forEach(r=>s.put(r))});recs=new Map(list.map(r=>[r.date,r]));
  await tx('weeks','readwrite',s=>{s.clear();wl.forEach(r=>s.put(r))});weeks=new Map(wl.map(r=>[r.date,r]))}
const live=d=>{const r=recs.get(d);return r&&!r.deleted?r:null};
const liveWeek=s=>{const w=weeks.get(s);return w&&!w.deleted?w:null};
const covered=(d,f)=>{const k=liveWeek(mondayOf(d));return !!k&&d<=k.end&&k[f]!=null};
const anyCovered=d=>['cents','clothes','customers'].some(f=>covered(d,f));
const liveWeeks=()=>[...weeks.values()].filter(w=>!w.deleted);
async function snapshot(label){
  const list=[...recs.values()],wl=[...weeks.values()],el=[...exps.values()];if(!list.length&&!wl.length&&!el.length)return;
  await tx('snapshots','readwrite',s=>s.add({at:new Date().toISOString(),day:todayStr(),label,records:list,weeks:wl,expenses:el}));
  const all=await tx('snapshots','readonly',s=>s.getAll());
  if(all.length>14){const old=all.slice(0,all.length-14);await tx('snapshots','readwrite',s=>{old.forEach(o=>s.delete(o.id))})}
}
async function changed(){await setCfg('lastChangeAt',new Date().toISOString())}

/* ---------- backup file: a CSV that Excel can open and this app can read back ---------- */
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(){
  const m=v=>v==null?'':(v/100).toFixed(2);const x4=r=>[m(r.clothes),m(r.cash),m(r.check),m(r.card)];
  const rows=[['날짜','요일','매상','손님','입력자','수정시각','상태','종류','종료일','귀속연도','항목','메모','번호','Clothes In','Cash','Check','Card']];
  [...recs.values()].sort((a,b)=>a.date<b.date?-1:1).forEach(r=>rows.push([r.date,DOW[dow(r.date)],m(r.cents),r.customers==null?'':r.customers,r.by||'',r.updatedAt||'',r.deleted?'삭제':'','','','','','','',...x4(r)]));
  [...weeks.values()].sort((a,b)=>a.date<b.date?-1:1).forEach(w=>rows.push([w.date,DOW[dow(w.date)],m(w.cents),w.customers==null?'':w.customers,w.by||'',w.updatedAt||'',w.deleted?'삭제':'','주간',w.end,w.year,'','','',...x4(w)]));
  [...exps.values()].sort((a,b)=>a.date<b.date?-1:1).forEach(x=>rows.push([x.date,DOW[dow(x.date)],(x.cents/100).toFixed(2),'',x.by||'',x.updatedAt||'',x.deleted?'삭제':'','지출','','',x.cat,x.memo||'',x.id,'','','','']));
  return '\uFEFF'+rows.map(x=>x.map(csvCell).join(',')).join('\r\n')+'\r\n';
}
function parseCSVRows(t){
  const out=[];let row=[],cell='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell=''}
    else cell+=c}
  if(cell!==''||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(x=>x.trim()!==''));
}
function normDate(s){s=String(s).trim();let m;
  if((m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/)))s=m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  else if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)))s=m[3]+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return validDate(s)?s:null}
function parseBackup(text){
  const rows=parseCSVRows(text);if(rows.length<1)throw new Error('empty');
  const h=rows[0].map(x=>x.trim());const col=n=>h.indexOf(n);
  if(col('날짜')<0||col('매상')<0||col('손님')<0)throw new Error('format');
  const list=[],wlist=[],elist=[],bad=[];
  rows.slice(1).forEach((r,i)=>{
    const cell=n=>col(n)>=0?String(r[col(n)]||'').trim():'';
    const date=normDate(cell('날짜'));const kind=cell('종류');
    const at=cell('수정시각');const meta={by:cleanName(cell('입력자')),updatedAt:isNaN(Date.parse(at))?'':at,deleted:cell('상태')==='삭제',rej:[]};
    if(kind==='지출'){
      const cents=parseMoney(cell('매상'));const id=cell('번호');const cat=cleanText(cell('항목'),40);
      if(!date||!cents||!id||id.length>64||!cat){bad.push(i+2);return}
      elist.push({id,date,cents,cat,memo:cleanText(cell('메모'),60),...meta});return;
    }
    let broken=false;
    const money=n=>{const t=cell(n);if(t==='')return null;const v=parseMoney(t);if(v===null)broken=true;return v};
    const cust=cell('손님');if(cust!==''&&!/^\d{1,6}$/.test(cust))broken=true;
    const v={cents:money('매상'),clothes:money('Clothes In'),cash:money('Cash'),check:money('Check'),card:money('Card'),customers:cust===''?null:Number(cust)};
    if(v.cents==null&&v.cash!=null)v.cents=(v.cash||0)+(v.check||0)+(v.card||0);
    if(!date||broken){bad.push(i+2);return}
    if(!meta.deleted&&FIELDS.every(f=>v[f]==null)){bad.push(i+2);return}
    if(kind==='주간'){
      const end=normDate(cell('종료일'));const y=Number(cell('귀속연도'));
      if(!end||end<date||!Number.isInteger(y)||y<1900||y>2200){bad.push(i+2);return}
      wlist.push({date,end,year:y,...v,...meta});return;
    }
    list.push({date,...v,...meta});
  });
  return{list,wlist,elist,bad};
}
const FIELDS=['clothes','customers','cash','check','card','cents'];
const sig=r=>r.deleted?'deleted':FIELDS.map(f=>r[f]==null?'':r[f]).join('|');
const esig=x=>x.deleted?'deleted':[x.date,x.cents,x.cat,x.memo||''].join('|');
const clash=(a,b)=>FIELDS.filter(f=>a[f]!=null&&b[f]!=null&&a[f]!==b[f]);
const fillIn=(a,b)=>{const o={...a};FIELDS.forEach(f=>{if(o[f]==null&&b[f]!=null)o[f]=b[f]});return o};
const takes=(a,b)=>{const o={...a};FIELDS.forEach(f=>{if(b[f]!=null)o[f]=b[f]});o.deleted=!!b.deleted;o.by=b.by;o.updatedAt=b.updatedAt;return o};
function planMerge(list,wlist,elist){
  const add=[],addW=[],addE=[],conflicts=[];let same=0;
  const plan=(items,store,out,kind)=>{const seen=new Set();items.forEach(n=>{if(seen.has(n.date))return;seen.add(n.date);
    const l=store.get(n.date);
    if(!l){out.push(n);return}
    if(!!l.deleted===!!n.deleted){
      const c=clash(l,n);
      if(!c.length||(l.rej||[]).includes(sig(n))){const m=fillIn(l,n);if(sig(m)!==sig(l))out.push(m);else same++;return}
    }else if((l.rej||[]).includes(sig(n))){same++;return}
    conflicts.push({kind,date:n.date,mine:l,theirs:n,pick:null});
  })};
  plan(list,recs,add,'day');plan(wlist,weeks,addW,'week');
  const seenE=new Set();elist.forEach(n=>{if(seenE.has(n.id))return;seenE.add(n.id);const l=exps.get(n.id);
    if(!l){addE.push(n);return}
    if(esig(l)===esig(n)||(l.rej||[]).includes(esig(n))){same++;return}
    conflicts.push({kind:'exp',date:n.date,mine:l,theirs:n,pick:null})});
  return{add,addW,addE,conflicts,same};
}

function weekDays(start){
  const days=[];for(let i=0;i<6;i++)days.push(addDays(start,i));
  const sun=addDays(start,6);if(live(sun)||live(lastYear(sun)))days.push(sun);
  return days;
}
const n2=c=>{if(c==null)return '';const big=Math.abs(c)>=1000000;return (big?Math.round(c/100):c/100).toLocaleString('en-US',{minimumFractionDigits:big?0:2,maximumFractionDigits:big?0:2})};
/* Week totals: a weekly record wins field by field; a total-only weekly record leaves Cash, Check and Card blank. */
function weekTotals(dayRecs,w){
  const out={};const sum=f=>{const v=dayRecs.filter(r=>r&&r[f]!=null);return v.length?v.reduce((t,r)=>t+r[f],0):null};
  FIELDS.forEach(f=>{out[f]=w&&w[f]!=null?w[f]:sum(f)});
  if(w&&w.cents!=null&&w.cash==null){out.cash=out.check=out.card=null}
  return out;
}

/* The week a date belongs to: an existing weekly record that contains it, otherwise Monday to Saturday. */
function weekFor(date){
  const hit=liveWeeks().find(w=>w.date<=date&&date<=w.end);
  if(hit)return{key:hit.date,end:hit.end,y:hit.year,rec:hit};
  const mon=mondayOf(date);
  if(liveWeek(mon))return{key:date,end:addDays(mon,5),y:year(addDays(mon,5)),rec:null};
  const end=addDays(mon,5);
  return{key:mon,end,y:year(end),rec:null};
}

    if(cs===''&&!entryWeek)return err('손님 수를 입력하세요. 예: 24');
    vals={clothes:a,customers:cs===''?null:Number(cs)};
  }else{
    const c=opt('fCash'),k=opt('fCheck'),d=opt('fCard');
    if(c===false||k===false||d===false)return err('금액을 숫자로 입력하세요. 예: 400.00');
    const anyS=c!==null||k!==null||d!==null;
    const tot=entryWeek?opt('fTotal'):null;if(tot===false)return err('합계를 숫자로 입력하세요. 예: 3606.44');
    if(anyS&&tot!==null)return err('Cash, Check, Card와 합계 중 하나만 입력하세요.');
    if(!anyS&&tot===null)return err('금액을 입력하세요. 없는 칸은 비워 두면 0으로 저장합니다.');
    vals=tot!==null?{cash:null,check:null,card:null,cents:tot}:{cash:c||0,check:k||0,card:d||0,cents:(c||0)+(k||0)+(d||0)};
  }
  $('fErr').hidden=true;
  const wk=entryWeek?weekFor(date):null;const old=entryWeek?wk.rec:live(date);
  const ch=old?Object.keys(vals).filter(f=>old[f]!=null&&old[f]!==vals[f]&&!(f!=='cents'&&vals[f]==null&&vals.cents!=null)):[];
  if(ch.length){
    pendingConfirm={wk,date,vals};
    const lines=ch.map(f=>esc(fLabel[f])+' '+valText(old[f],f)+' → '+valText(vals[f],f)).join(', ');
    $('fConfirm').innerHTML='<div class="confirm"><div>'+esc(entryWeek?engRange(wk.key,wk.end)+' 주간':longDate(date))+'에 이미 입력된 값이 있습니다('+esc(old.by||'이름 없음')+' 입력). '+lines+'으로 바꿀까요?</div><div class="btns"><button type="button" class="main" data-act="ow-yes">바꾸기</button><button type="button" data-act="ow-no">그대로 두기</button></div></div>';
    return;
  }
  if(entryWeek)commitWeek(wk,vals);else commitSide(date,vals);
}

/* ---------- analysis ---------- */
function yearsWithData(){const s=new Set([year(todayStr())]);recs.forEach(r=>{if(!r.deleted)s.add(year(r.date))});liveWeeks().forEach(w=>s.add(w.year));liveExps().forEach(x=>s.add(year(x.date)));return [...s].sort((a,b)=>b-a)}
function weeksOf(y){
  const today=todayStr(),w=new Map();
  recs.forEach(r=>{if(r.deleted)return;const m=mondayOf(r.date);if(year(m)!==y)return;
    if(liveWeek(m)&&liveWeek(m).year!==y)return;
    const e=w.get(m)||{start:m,end:addDays(m,5),cents:0,clothes:0,customers:0,n:{cents:0,clothes:0,customers:0},wk:{}};
    ['cents','clothes','customers'].forEach(f=>{if(r[f]!=null){e[f]+=r[f];e.n[f]++}});w.set(m,e)});
  liveWeeks().forEach(k=>{if(k.year!==y||(toUTC(k.end)-toUTC(k.date))/864e5<4)return;
    const e=w.get(k.date)||{start:k.date,end:k.end,cents:0,clothes:0,customers:0,n:{cents:0,clothes:0,customers:0},wk:{}};
    e.end=k.end;['cents','clothes','customers'].forEach(f=>{if(k[f]!=null){e[f]=k[f];e.wk[f]=true}});w.set(k.date,e)});
  return [...w.values()].map(e=>{const ok=f=>e.wk[f]||(addDays(e.start,5)<today&&e.n[f]>=4);return{...e,ok:{cents:ok('cents'),clothes:ok('clothes'),customers:ok('customers')}}});
}
function monthData(y){
  const a=Array.from({length:12},()=>({cents:0,clothes:0,customers:0,dcents:0,dclothes:0,dcustomers:0}));
  const F=['cents','clothes','customers'];
  recs.forEach(r=>{if(r.deleted||year(r.date)!==y)return;const e=a[Number(r.date.slice(5,7))-1];F.forEach(f=>{if(r[f]!=null&&!covered(r.date,f)){e[f]+=r[f];e['d'+f]++}})});
  liveWeeks().forEach(w=>{if(w.year!==y)return;const ey=year(w.end);const i=ey===y?Number(w.end.slice(5,7))-1:ey>y?11:0;F.forEach(f=>{if(w[f]!=null){a[i][f]+=w[f];a[i]['d'+f]+=6}})});
  return a;
}
function monthDone(y,i){const t=todayStr();const next=i===11?(y+1)+'-01-01':y+'-'+pad(i+2)+'-01';return next<=t}
function yearNet(){
  const ys=[...new Set(liveExps().map(x=>year(x.date)))].sort((a,b)=>b-a);if(!ys.length)return '';
  const rows=ys.map(y=>{const ex=expByMonth(y),inc=monthData(y);let i=0,e=0;ex.forEach((v,m)=>{if(v){i+=inc[m].cents;e+=v}});const n=i-e;
    return '<tr><td style="font-weight:600">'+y+'</td><td>'+usd(e)+'</td><td class="'+(n<0?'neg':'')+'">'+money0(n)+'</td></tr>'}).join('');
  return '<div class="gap"></div><p style="font-weight:600">연도별 지출과 순수익</p><table class="wk wkd" aria-label="연도별 지출과 순수익"><thead><tr><th style="width:18%">연도</th><th style="width:41%">지출</th><th style="width:41%">순수익</th></tr></thead><tbody>'+rows+'</tbody></table><p class="small">순수익은 지출을 입력한 달의 수입에서 지출을 뺀 값입니다.</p>';
}
function yearSheet(){
  const K=statKey==='customers'?'cents':statKey;const label=K==='cents'?'Cash In':'Clothes In';
  const t=todayStr(),ty=year(t),map=new Map();
  const get=y=>{if(!map.has(y))map.set(y,{val:0,customers:0,days:0,cdays:0,wks:0});return map.get(y)};
  recs.forEach(r=>{if(r.deleted)return;const e=get(year(r.date));if(r.customers!=null&&!covered(r.date,'customers')){e.customers+=r.customers;e.cdays++}if(r[K]!=null&&!covered(r.date,K)){e.val+=r[K];e.days++}});
  liveWeeks().forEach(w=>{const e=get(w.year);if(w[K]!=null){e.val+=w[K];e.wks++}if(w.customers!=null){e.customers+=w.customers;e.cdays+=6}});
  const ys=[...map.keys()].sort((a,b)=>b-a);
  if(!ys.length)return '<section class="sheet" id="yearSheet"><h2>연도별 매상</h2><p class="small">매상을 입력하면 연도별 합계가 나옵니다.</p></section>';
  const matched=y=>{const mon=new Map();recs.forEach(r=>{if(r.deleted||r[K]==null||year(r.date)!==y)return;const m=mondayOf(r.date);if(liveWeek(m)&&liveWeek(m)[K]!=null)return;if(!mon.has(m))mon.set(m,[]);mon.get(m).push(r)});
    let cur=0,pre=0,n=0;
    mon.forEach((rs,m)=>{const pw=liveWeek(lastYear(m));
      if(pw&&pw[K]!=null){if(addDays(m,5)<t){rs.forEach(r=>{cur+=r[K]});pre+=pw[K];n++}else rs.forEach(r=>{const p=live(lastYear(r.date));if(p&&p[K]!=null){cur+=r[K];pre+=p[K];n++}});return}
      rs.forEach(r=>{const p=live(lastYear(r.date));if(p&&p[K]!=null){cur+=r[K];pre+=p[K];n++}})});
    liveWeeks().forEach(w=>{if(w.year===y&&w[K]!=null){const pw=liveWeek(lastYear(w.date));if(pw&&pw[K]!=null){cur+=w[K];pre+=pw[K];n++}}});
    return n?{cur,pre}:null};
  const rows=ys.map(y=>{const e=map.get(y),prevE=map.get(y-1);let cmp=null;
    if(y===ty)cmp=matched(y);
    else if(prevE&&prevE.val)cmp={cur:e.val,pre:prevE.val};
    const d=cmp?cmp.cur-cmp.pre:null;
    const sub=[e.wks?e.wks+'주':'',e.days?e.days+'일 입력':''].filter(Boolean).join(' · ');
    return '<tr><td style="font-weight:600">'+y+'<span class="sub">'+(y===ty?'진행 중':'')+'</span></td><td>'+usd(e.val)+'<span class="sub">'+sub+'</span></td><td>'+(e.cdays?e.customers.toLocaleString('en-US')+'명':'-')+'</td>'
      +(d===null?'<td class="blank">-</td>':'<td class="'+tone(d)+'">'+signed(d)+'<span class="sub">'+pct(cmp.cur,cmp.pre)+'</span></td>')+'</tr>'}).join('');
  const note=ys.includes(ty)&&matched(ty)?'<p class="small">'+ty+'년은 입력한 주를 '+(ty-1)+'년 같은 주와 비교합니다.</p>':'';
  return '<section class="sheet" id="yearSheet"><h2>연도별 매상 · '+label+'</h2><table class="wk" aria-label="연도별 매상 합계"><thead><tr><th style="width:18%">연도</th><th style="width:30%">'+label+'</th><th style="width:22%">손님</th><th style="width:30%">증감</th></tr></thead><tbody>'+rows+'</tbody></table>'+note+yearNet()+'</section>';
}
function expByMonth(y){const a=Array(12).fill(0);liveExps().forEach(x=>{if(year(x.date)===y)a[Number(x.date.slice(5,7))-1]+=x.cents});return a}
const money0=v=>(v<0?'-':'')+usd(v);
function netSheet(y){
  const ex=expByMonth(y),inc=monthData(y);
  if(!ex.some(v=>v))return '<section class="sheet" id="netSheet"><h2>'+y+'년 수입과 지출</h2><p class="small">이 해에 입력한 지출이 없습니다. 지출 탭에서 입력하면 순수익이 나옵니다.</p></section>';

    return '<tr><td style="font-weight:600">'+(i+1)+'월</td><td>'+usd(inc[i].cents)+'</td><td>'+usd(v)+'</td><td class="'+(n<0?'neg':'')+'">'+money0(n)+'</td></tr>'}).join('');
  const tn=ti-te;
  const by=new Map();liveExps().forEach(x=>{if(year(x.date)===y)by.set(x.cat,(by.get(x.cat)||0)+x.cents)});

function statsView(){

  const wk=weeksOf(statYear);let hi=null,lo=null;
  wk.filter(e=>e.ok[k]).forEach(e=>{if(!hi||e[k]>hi[k])hi=e;if(!lo||e[k]<lo[k])lo=e});

   +'<p class="small">'+statYear+'년 합계 '+tot(cur)+' · '+(statYear-1)+'년 합계 '+tot(prev)+'</p>'
   +'<p class="small">주간 기록은 그 주 토요일이 속한 달로 계산합니다. 최고와 최저는 끝난 달 중 15일 이상 입력한 달만 표시합니다.</p></section>'+netSheet(statYear)+yearSheet();

  const x={id:old?old.id:newId(),date,cents,cat,memo:cleanText($('eMemo').value,60),by:cfg.name||'',updatedAt:new Date().toISOString(),deleted:false,rej:old?old.rej||[]:[]};
  await putExp(x);await setCfg('lastCat',cat);
  expEdit=null;expDate=date;expMonth=date.slice(0,7);await render();toast(usd(cents)+' '+cat+(old?' 고쳤습니다':' 저장했습니다'));
}
async function deleteExp(id){const o=exps.get(id);if(!o)return;await putExp({...o,deleted:true,by:cfg.name||'',updatedAt:new Date().toISOString()});expEdit=null;await render();toast('지출을 삭제했습니다')}
async function renameCat(i,name){
  const list=[...cats()];const old=list[i];const nw=cleanText(name,40);const e=$('catErr');e.hidden=true;
  if(nw===old)return;
  if(!nw||list.includes(nw)){e.textContent=nw?'같은 이름의 항목이 이미 있습니다.':'항목 이름을 입력하세요.';e.hidden=false;$('cat'+i).value=old;return}
  list[i]=nw;await setCfg('expCats',list);
  const now=new Date().toISOString();
  for(const x of liveExps())if(x.cat===old)await putExp({...x,cat:nw,updatedAt:now});
  if(cfg.lastCat===old)await setCfg('lastCat',nw);
  await render();toast('항목 이름을 바꿨습니다');
}
/* ---------- backup and merge ---------- */
function when(iso){if(!iso)return '없음';const d=new Date(iso);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
const recText=(r,kind)=>{if(r.deleted)return '삭제됨';if(kind==='exp')return usd(r.cents)+', '+r.cat;const p=[];if(r.clothes!=null)p.push('Clothes '+usd(r.clothes));if(r.cents!=null)p.push('Cash In '+usd(r.cents));if(r.customers!=null)p.push(r.customers+'명');return p.join(', ')};
const weekRange=w=>year(w.date)+'/'+md(w.date)+'~'+md(w.end)+' 주간';
function mergeCard(){
  if(!merge)return '';
  const unresolved=merge.conflicts.filter(c=>!c.pick).length;
  const cs=merge.conflicts.map((c,i)=>'<div class="conflict"><div><b>'+esc(c.kind==='week'?weekRange(c.mine):c.kind==='exp'?longDate(c.mine.date)+' 지출':longDate(c.date))+'</b></div><div class="choice" role="group" aria-label="쓸 값 고르기"><button type="button" data-pick="mine" data-i="'+i+'" aria-pressed="'+(c.pick==='mine')+'">이 휴대폰<br>'+esc(recText(c.mine,c.kind))+'<br><span style="font-weight:400">'+esc(c.mine.by||'이름 없음')+'</span></button><button type="button" data-pick="theirs" data-i="'+i+'" aria-pressed="'+(c.pick==='theirs')+'">받은 파일<br>'+esc(recText(c.theirs,c.kind))+'<br><span style="font-weight:400">'+esc(c.theirs.by||'이름 없음')+'</span></button></div></div>').join('');
  return '<section class="card" id="mergeCard"><h2>파일 합치기</h2><div class="stack"><p>새 기록 '+merge.add.length+'건 · 주간 기록 '+merge.addW.length+'건 · 지출 '+merge.addE.length+'건 · 같은 기록 '+merge.same+'건 · 값이 다른 기록 '+merge.conflicts.length+'건</p>'
   +(merge.bad.length?'<p class="err">읽지 못한 줄 '+merge.bad.length+'개는 건너뜁니다.</p>':'')
   +cs+'<p class="err" id="mErr" role="alert" hidden></p><div class="btns"><button type="button" class="main" data-act="merge-go">'+(unresolved?'합치기 · '+unresolved+'건 남음':'합치기')+'</button><button type="button" data-act="merge-cancel">취소</button></div></div></section>';
}
async function runMerge(){
  if(merge.conflicts.some(c=>!c.pick)){const e=$('mErr');e.textContent='값이 다른 날짜마다 쓸 값을 고르세요.';e.hidden=false;return}
  await snapshot('합치기 전');
  const put=[...merge.add],putW=[...merge.addW],putE=[...merge.addE];
  merge.conflicts.forEach(c=>{
    const out=c.kind==='week'?putW:c.kind==='exp'?putE:put;const sg=c.kind==='exp'?esig:sig;
    if(c.kind==='exp'){
      if(c.pick==='theirs')out.push({...c.theirs,rej:[...new Set([...(c.mine.rej||[]),sg(c.mine)])]});
      else out.push({...c.mine,rej:[...new Set([...(c.mine.rej||[]),sg(c.theirs)])]});
    }else if(c.pick==='theirs')out.push({...takes(c.mine,c.theirs),rej:[...new Set([...(c.mine.rej||[]),sig(c.mine)])]});
    else out.push({...fillIn(c.mine,c.theirs),rej:[...new Set([...(c.mine.rej||[]),sig(c.theirs)])]});
  });
  await tx('records','readwrite',s=>{put.forEach(r=>s.put(r))});
  await tx('weeks','readwrite',s=>{putW.forEach(r=>s.put(r))});
  await tx('expenses','readwrite',s=>{putE.forEach(r=>s.put(r))});
  put.forEach(r=>recs.set(r.date,r));putW.forEach(r=>weeks.set(r.date,r));putE.forEach(r=>exps.set(r.id,r));
  const newCats=[...new Set(putE.filter(x=>!x.deleted).map(x=>x.cat))].filter(c=>!cats().includes(c));if(newCats.length)await setCfg('expCats',[...cats(),...newCats]);
  const n=merge.add.length+merge.addW.length+merge.addE.length+merge.conflicts.filter(c=>c.pick==='theirs').length;
  merge=null;if(put.length||putW.length||putE.length)await changed();render();toast(n+'건을 합쳤습니다');
}
let snapList=[];
function dataView(){
  const count=[...recs.values()].filter(r=>!r.deleted).length;
  const snaps=snapList.slice().reverse().map(s=>'<div><span>'+esc(when(s.at))+' · '+(s.records.filter(r=>!r.deleted).length+(s.weeks||[]).filter(w=>!w.deleted).length+(s.expenses||[]).filter(x=>!x.deleted).length)+'건'+(s.label?' · '+esc(s.label):'')+'</span><button type="button" class="mini" data-restore="'+s.id+'">되돌리기</button></div>').join('');
  return mergeCard()
   +'<section class="card"><h2>두 사람 기록 맞추기</h2><div class="stack"><ol class="how"><li>입력한 사람이 <b>기록 보내기</b>를 눌러 파일을 문자나 카톡으로 보냅니다.</li><li>받은 사람은 파일을 휴대폰에 저장합니다.</li><li>받은 사람이 <b>받은 파일 합치기</b>를 눌러 그 파일을 고릅니다.</li></ol><p class="note">한 사람은 Clothes In, 다른 사람은 Cash In처럼 나눠 입력해도 같은 날짜로 합쳐집니다. 같은 칸의 값이 서로 다를 때만 어느 쪽을 쓸지 묻습니다. 지금 쓰시는 매상 노트의 백업 파일과 지난 기록 파일도 받은 파일 합치기로 넣습니다.</p><div class="btns"><button type="button" class="main" data-act="share">기록 보내기</button><button type="button" data-act="pick">받은 파일 합치기</button></div></div></section>'
   +'<section class="card"><h2>백업</h2><div class="stack"><p class="note">기록 '+count+'건'+(liveWeeks().length?' · 주간 기록 '+liveWeeks().length+'건':'')+(liveExps().length?' · 지출 '+liveExps().length+'건':'')+' · 마지막 백업 '+esc(when(cfg.lastBackupAt))+'</p><div class="btns"><button type="button" data-act="backup">휴대폰에 저장</button><button type="button" data-act="share">iCloud·구글 드라이브에 저장</button></div><p class="note">휴대폰 안에 저장한 파일은 휴대폰을 잃어버리면 함께 사라집니다. 가끔은 iCloud나 구글 드라이브에도 저장하세요. 새 휴대폰에서는 받은 파일 합치기로 백업 파일을 고르면 복원됩니다. 백업 파일은 엑셀에서도 열립니다.</p></div></section>'
   +'<section class="card"><h2>자동 복사본</h2><div class="stack"><p class="note">하루 한 번 이 휴대폰 안에 최근 14개까지 보관합니다. 실수로 잘못 고쳤을 때 되돌리는 용도입니다.</p><div id="restoreAsk"></div>'+(snaps?'<div class="list">'+snaps+'</div>':'<p class="note">아직 복사본이 없습니다. 기록을 입력하면 다음에 앱을 열 때 만들어집니다.</p>')+'</div></section>'
   +'<section class="card"><h2>앱 이름</h2><form id="appNameForm" class="stack" novalidate><label>맨 위에 표시될 이름<input id="appNameInput" autocomplete="off" maxlength="20" placeholder="매상 노트 2" value="'+esc(cfg.appName||'')+'"></label><p class="note">비워 두면 매상 노트 2로 돌아갑니다. 이 휴대폰에만 적용됩니다. 홈 화면 아이콘 이름은 아이콘을 추가할 때 정합니다.</p><div class="btns"><button type="submit">앱 이름 저장</button></div></form></section>'
   +'<section class="card"><h2>내 이름</h2><form id="nameForm" class="stack" novalidate><label>입력자로 표시될 이름<input id="nameInput" autocomplete="off" maxlength="20" value="'+esc(cfg.name||'')+'"></label><p class="err" id="nameErr" role="alert" hidden></p><div class="btns"><button type="submit">이름 저장</button></div></form></section>';
}
async function handleFile(file){
  if(!file)return;
  if(file.size>5*1024*1024){toast('파일이 너무 큽니다. 백업 파일을 골라 주세요');return}
  try{
    const{list,wlist,elist,bad}=parseBackup(await file.text());
    if(!list.length&&!wlist.length&&!elist.length){toast('읽을 수 있는 기록이 없습니다');return}
    merge={...planMerge(list,wlist,elist),bad};tab='data';await render();
    const m=$('mergeCard');if(m)m.scrollIntoView({block:'start'});
  }catch(e){toast('매상 노트 백업 파일이 아닙니다. 다른 파일을 골라 주세요')}
}

/* ---------- screen ---------- */
async function render(){
  const appName=cfg.appName||'매상 노트 2';$('appTitle').textContent=appName;document.title=appName;
  $('who').textContent=cfg.name?cfg.name+' 입력 중':'';
  document.querySelectorAll('#tabs button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  renderBanners();
  const v=$('view');
  if(tab==='week'){v.innerHTML=formCard()+weekSheet();fillForm()}
  else if(tab==='stats'){v.innerHTML=statsView()}
  else if(tab==='exp'){v.innerHTML=expView();fillExp()}
  else{snapList=await tx('snapshots','readonly',s=>s.getAll());v.innerHTML=dataView()}
}
function welcome(){
  $('tabs').hidden=true;
  $('view').innerHTML='<section class="card"><h2>매상 노트 2 시작하기</h2><form id="firstForm" class="stack" novalidate><p class="note">매상과 손님 수를 작년 같은 요일과 비교합니다. 기록은 이 휴대폰에만 저장되고, 가입은 필요 없습니다.</p><label>입력자로 표시될 이름<input id="firstName" autocomplete="off" maxlength="20" placeholder="종호"></label><p class="err" id="firstErr" role="alert" hidden></p><button type="submit" class="main">시작하기</button></form></section>';
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.tab){tab=b.dataset.tab;await render();scrollTo(0,0);return}
  if(b&&b.dataset.key){statKey=b.dataset.key;render();return}
  if(b&&b.dataset.side){entrySide=b.dataset.side;render();return}
  if(b&&b.dataset.catDel){const i=+b.dataset.catDel;const list=[...cats()];if(list.length<2){const x=$('catErr');x.textContent='항목은 하나 이상 있어야 합니다.';x.hidden=false;return}list.splice(i,1);await setCfg('expCats',list);render();return}
  if(b&&b.dataset.pick){merge.conflicts[+b.dataset.i].pick=b.dataset.pick;render();return}
  if(b&&b.dataset.restore){
    const id=+b.dataset.restore;const s=snapList.find(x=>x.id===id);if(!s)return;
    $('restoreAsk').innerHTML='<div class="confirm"><div>'+esc(when(s.at))+' 상태로 되돌릴까요? 지금 기록은 복사본으로 남겨 둡니다.</div><div class="btns"><button type="button" class="main" data-restore-yes="'+id+'">되돌리기</button><button type="button" data-act="restore-no">취소</button></div></div>';
    $('restoreAsk').scrollIntoView({block:'nearest'});return}
  if(b&&b.dataset.restoreYes){
    const s=snapList.find(x=>x.id===+b.dataset.restoreYes);if(!s)return;
    await snapshot('되돌리기 전');await replaceAll(s.records,s.weeks||[],s.expenses||[]);await changed();await render();toast('되돌렸습니다');return}
  const act=b&&b.dataset.act;
  if(act){switch(act){
    case 'exp-prev':expMonth=shiftMonth(expMonth,-1);render();break;
    case 'exp-next':expMonth=shiftMonth(expMonth,1);render();break;
    case 'exp-cancel':expEdit=null;render();break;
    case 'exp-del-ask':$('eConfirm').innerHTML='<div class="confirm"><div>이 지출을 삭제할까요?</div><div class="btns"><button type="button" class="danger" data-act="exp-del-yes">삭제</button><button type="button" data-act="exp-del-no">취소</button></div></div>';break;
    case 'exp-del-yes':deleteExp(expEdit);break;
    case 'exp-del-no':$('eConfirm').innerHTML='';break;
    case 'wk-prev':weekStart=addDays(weekStart,-7);render();break;
    case 'wk-next':weekStart=addDays(weekStart,7);render();break;
    case 'wk-now':weekStart=mondayOf(todayStr());render();break;
    case 'ow-yes':if(pendingConfirm){const p=pendingConfirm;pendingConfirm=null;if(p.wk)commitWeek(p.wk,p.vals);else commitSide(p.date,p.vals)}break;
    case 'ow-no':fillForm();break;
    case 'wk-toggle':entryWeek=!entryWeek;render();break;
    case 'del-ask':$('fConfirm').innerHTML='<div class="confirm"><div>'+esc(entryWeek?(k=>engRange(k.key,k.end)+' 주간')(weekFor(formDate)):longDate(formDate))+'의 '+sideName()+' 값을 삭제할까요?</div><div class="btns"><button type="button" class="danger" data-act="del-yes">삭제</button><button type="button" data-act="ow-no">취소</button></div></div>';break;
    case 'del-yes':clearSide();break;
    case 'backup':await saveToPhone();if(tab==='data')render();break;
    case 'share':await shareOut();if(tab==='data')render();break;
    case 'pick':$('filePick').value='';$('filePick').click();break;
    case 'backup-later':await setCfg('promptDay',todayStr());renderBanners();break;
    case 'install-later':await setCfg('installDismissed',true);renderBanners();break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;renderBanners()}break;
    case 'merge-go':runMerge();break;
    case 'merge-cancel':merge=null;render();break;
    case 'restore-no':$('restoreAsk').innerHTML='';break;
  }return}
  const et=e.target.closest('tr[data-exp]');if(et){expEdit=et.dataset.exp;await render();scrollTo(0,0);$('eAmt').focus();return}
  const tr=e.target.closest('tr[data-date]');
  if(tr&&tr.dataset.date<=todayStr()){formDate=tr.dataset.date;entryWeek=false;render();scrollTo(0,0)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='entry')submitEntry();
  if(e.target.id==='expForm')submitExp();
  if(e.target.id==='catForm'){const n=cleanText($('catNew').value,40);const x=$('catErr');x.hidden=true;if(!n||cats().includes(n)){x.textContent=n?'같은 이름의 항목이 이미 있습니다.':'항목 이름을 입력하세요.';x.hidden=false;return}await setCfg('expCats',[...cats(),n]);await setCfg('lastCat',n);render();toast('항목을 추가했습니다')}
  if(e.target.id==='firstForm'){const n=cleanName($('firstName').value);if(!n){const x=$('firstErr');x.textContent='이름을 입력하세요.';x.hidden=false;return}await setCfg('name',n);$('tabs').hidden=false;render()}
  if(e.target.id==='appNameForm'){await setCfg('appName',String($('appNameInput').value).trim().slice(0,20));await render();toast('앱 이름을 저장했습니다')}
  if(e.target.id==='nameForm'){const n=cleanName($('nameInput').value);if(!n){const x=$('nameErr');x.textContent='이름을 입력하세요.';x.hidden=false;return}await setCfg('name',n);render();toast('이름을 저장했습니다')}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fDate'&&validDate(e.target.value)){formDate=e.target.value;fillForm()}
  if(e.target.dataset&&e.target.dataset.cat!==undefined)renameCat(+e.target.dataset.cat,e.target.value);
  if(e.target.id==='eDate'&&validDate(e.target.value)&&!expEdit)expDate=e.target.value;
  if(e.target.id==='statYear'){statYear=Number(e.target.value);render()}
  if(e.target.id==='filePick')handleFile(e.target.files[0]);
});
document.addEventListener('input',e=>{if(['fClothes','fCust','fCash','fCheck','fCard','fTotal'].includes(e.target.id)){const x=$('fErr');if(x)x.hidden=true;updateSum()}if(e.target.id==='eAmt'){const x=$('eErr');if(x)x.hidden=true}});

['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(cfg.name)renderBanners()});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

(async function start(){
  try{
    db=await openDB();await loadAll();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const snaps=await tx('snapshots','readonly',s=>s.getAll());
    const last=snaps[snaps.length-1];
    if((recs.size||weeks.size||exps.size)&&(!last||last.day!==todayStr()))await snapshot('자동');
    if(!cfg.name)welcome();else render();
  }catch(e){
    $('view').innerHTML='<section class="card"><h2>기록을 열 수 없습니다</h2><p class="note">개인정보 보호 모드를 끄거나 홈 화면의 앱에서 다시 열어 보세요.</p></section>';
  }
})();
</script>
